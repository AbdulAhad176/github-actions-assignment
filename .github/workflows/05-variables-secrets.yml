name: 05 - Variables Secrets and Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demonstrate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository using GITHUB_TOKEN
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read repository variable
        env:
          STUDENT_NAME: ${{ vars.STUDENT_NAME }}
        run: |
          if [ -z "$STUDENT_NAME" ]; then
            echo "STUDENT_NAME is missing."
            exit 1
          fi
          echo "Student name: $STUDENT_NAME"

      - name: Demonstrate masking of practice secret
        env:
          PRACTICE_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -z "$PRACTICE_SECRET" ]; then
            echo "MY_SECRET is missing."
            exit 1
          fi
          echo "Practice secret: $PRACTICE_SECRET"

      - name: Call GitHub API using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
          echo "Authenticated API request completed."

      - name: Fetch repository using checkout credentials
        run: |
          git fetch origin main
          echo "Git fetch completed using the credentials configured by checkout."
